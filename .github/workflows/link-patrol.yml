name: Link Patrol (weekly)

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-patrol
  cancel-in-progress: false

jobs:
  patrol:
    name: Probe resource URLs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run link checker
        run: node scripts/check-links.mjs --out link-report.json
        continue-on-error: true

      - name: Build issue body
        id: report
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('link-report.json', 'utf8'));
          const problems = [
            ...r.dead.map((x) => ['💀 死链 (404/410)', x]),
            ...r['server-error'].map((x) => ['🔥 服务端错误 (5xx)', x]),
            ...r.unreachable.map((x) => ['⏛ 超时/不可达', x]),
          ];
          const blocked = r.blocked;
          let body = `## 链接巡检报告\n\n- 巡检时间：${r.checkedAt} (UTC)\n- 总计：${r.total}\n- 存活：${r.alive.length} · 反爬拦截(存疑)：${blocked.length} · 问题链接：${problems.length}\n`;
          if (problems.length) {
            body += `\n### 需要处理（${problems.length} 条）\n\n| 状态 | URL | 来源 |\n|---|---|---|\n`;
            for (const [tag, x] of problems.slice(0, 200)) {
              body += `| ${tag} | ${x.url} | \`${x.sources[0]}\` |\n`;
            }
            if (problems.length > 200) body += `\n… 其余 ${problems.length - 200} 条见 Artifact \`link-report.json\`\n`;
          }
          if (blocked.length) {
            body += `\n### 反爬拦截（存疑，人工抽查即可，${blocked.length} 条）\n\n<details><summary>展开</summary>\n\n`;
            for (const x of blocked.slice(0, 50)) body += `- ${x.url} (${x.status})\n`;
            body += '\n</details>\n';
          }
          if (!problems.length && !blocked.length) body += '\n全部存活 🎉\n';
          const { writeFileSync } = await import('node:fs');
          writeFileSync('issue-body.md', body);
          console.log(`problems=${problems.length} blocked=${blocked.length}`);
          EOF

      - name: Create or update issue on problems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROBLEMS=$(node -e "const r=require('./link-report.json');console.log(r.dead.length+r['server-error'].length+r.unreachable.length)")
          TITLE="🔗 每周链接巡检：发现 $PROBLEMS 条问题链接"
          if [ "$PROBLEMS" = "0" ]; then
            echo "无问题链接，跳过建 issue"
            exit 0
          fi
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label link-patrol --json number --jq '.[0].number')
          if [ -n "$NUMBER" ] && [ "$NUMBER" != "null" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md --label link-patrol
          fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
