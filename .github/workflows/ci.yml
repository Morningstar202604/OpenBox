name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只保留最新一次检查，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (tsc + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci 严格按 package-lock.json 安装，保证构建可复现
      # （取代此前掩盖 peer 冲突的 npm install --legacy-peer-deps）
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # 构建验证产物完整性；生产部署由 Cloudflare Pages 的 Git 集成独立完成，
      # CI 不再承担部署职责（避免双线路互相覆盖）。
      - name: Regenerate sitemap
        run: npm run gen:sitemap

      - name: Build (Vite)
        run: npm run build

      - name: Verify docs/index.html exists
        run: test -f docs/index.html
