name: Deploy to Cloudflare Pages

# 部署暂未启用：仅保留手动触发（workflow_dispatch），避免无令牌时“假成功”及与 monitor 形成冗余链路。
# 待提供 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID 并关闭 Cloudflare 直接 Git 集成后，再加回 push 触发。
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# 同一时间只跑一个部署，避免 monitor 推送与手动推送重叠触发双部署
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: VITE_BUILD_DIR=dist npm run build
        env:
          VITE_BASE_URL: /
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check Cloudflare secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[deploy] Cloudflare 密钥未配置，跳过部署（不失败、不触发通知）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: openbox-nav
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
