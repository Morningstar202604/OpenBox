# Cloudflare Pages 项目配置
# 用法：
#   本地预览构建：npm run build && npx wrangler pages dev docs
#   命令行部署：npm run build && npx wrangler pages deploy docs --project-name openbox
# 也可在 Cloudflare 控制台「Pages → Connect to Git」连仓库，无需手动跑命令。

name = "openbox-13o"
pages_build_output_dir = "docs"
compatibility_date = "2024-09-23"
