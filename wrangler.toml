# Cloudflare Pages 项目配置（自建项目 openbox-nav，GitHub Actions 自动部署）
# 用法：
#   本地预览构建：npm run build && npx wrangler pages dev docs
#   命令行部署：VITE_BASE_URL=/ npm run build && npx wrangler pages deploy docs --project-name openbox-nav
# 生产部署由 .github/workflows/deploy.yml 在 push main 时自动完成，无需手动跑命令。

name = "openbox-nav"
pages_build_output_dir = "docs"
compatibility_date = "2024-09-23"
