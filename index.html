<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- PWA manifest 与 Service Worker 由 vite-plugin-pwa 在构建期注入（base 自适应） -->
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 防止主题闪烁（FOUC）：React 挂载前同步读取 localStorage(ob_theme) 并应用 .dark -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ob_theme');
          var isDark = true;
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'light' || t === 'dark') isDark = t === 'dark';
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Primary Meta -->
    <title>OpenBox · 开源 AI 资源导航</title>
    <meta name="description" content="OpenBox · 开源 AI 资源导航 — 聚合免费 API、中转站、代理节点、AI 应用、工具与学习资料。14 大分类 280+ 精选资源，社区投稿 + 实跳验证 + 人工精选，三语界面，登录云同步。Free & open-source AI resources directory: free LLM APIs, relay gateways, AI tools. 無料AIリソースまとめ。主站：openbox-nav-5ke.pages.dev" />
    <meta name="keywords" content="开源导航,AI资源,免费API,中转站,代理节点,AI应用,AI工具,学习资源,白嫖,OpenBox,free ai api,free llm api,free ai tools,gpt free,gemini free,claude free,ai gateway,無料 API,無料 AI ツール,AI ナビ" />
    <meta name="author" content="OpenBox" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- theme-color 双值：跟随明暗模式（色值与 index.css 的 --color-bg 保持同步） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0d0b" />
    <link rel="canonical" href="https://openbox-nav-5ke.pages.dev/" />

    <!-- hreflang：本站语言由 localStorage 记忆、URL 参数不生效，
         因此不声明 en/ja 独立地址（避免搜索引擎把同一页面当多语言收录） -->
    <link rel="alternate" hreflang="zh-Hans" href="https://openbox-nav-5ke.pages.dev/" />
    <link rel="alternate" hreflang="x-default" href="https://openbox-nav-5ke.pages.dev/" />
